      <div class="panel-title" style="margin-bottom:12px">Business Profile</div>
      <div class="form-grid">
        <div class="field"><label>Business Name</label><input id="s_name" value="${esc(s.businessName)}"></div>
        <div class="field"><label>Subtitle</label><input id="s_sub" value="${esc(s.subtitle)}"></div>
        <div class="field"><label>Currency Symbol</label><input id="s_currency" value="${esc(s.currency)}"></div>
        <div class="field"><label>Date Format</label><input id="s_dateformat" value="${esc(s.dateFormat)}"></div>
      </div>
      <button class="btn btn-primary" style="margin-top:12px" onclick="saveProfile()">Save Profile</button>
    </div>
    <div class="panel"><div class="panel-title">Business Types</div>
      <div class="settings-list">${s.businessTypes.map(t=>`<div class="settings-tag">${esc(t)}<button onclick="removeFromList('businessTypes','${esc(t)}')">${icon('x')}</button></div>`).join('')}</div>
      <div class="add-inline"><input id="newType" placeholder="Add business type"><button class="btn btn-sm btn-primary" onclick="addToList('businessTypes','newType')">Add</button></div>
    </div>
    <div class="panel"><div class="panel-title">Products</div>
      <div class="settings-list">${s.products.map(t=>`<div class="settings-tag">${esc(t)}<button onclick="removeFromList('products','${esc(t)}')">${icon('x')}</button></div>`).join('')}</div>
      <div class="add-inline"><input id="newProduct" placeholder="Add product"><button class="btn btn-sm btn-primary" onclick="addToList('products','newProduct')">Add</button></div>
    </div>
    <div class="panel"><div class="panel-title">Tags</div>
      <div class="settings-list">${s.tags.map(t=>`<div class="settings-tag">${esc(t)}<button onclick="removeFromList('tags','${esc(t)}')">${icon('x')}</button></div>`).join('')}</div>
      <div class="add-inline"><input id="newTag" placeholder="Add tag"><button class="btn btn-sm btn-primary" onclick="addToList('tags','newTag')">Add</button></div>
    </div>
    <div class="panel"><div class="panel-title">Follow-Up Types</div>
      <p style="font-size:12px;color:var(--ink-faint);margin:4px 0 0">These appear as quick-pick chips when scheduling a follow-up.</p>
      <div class="settings-list">${s.followupTypes.map(t=>`<div class="settings-tag">${esc(t)}<button onclick="removeFromList('followupTypes','${esc(t)}')">${icon('x')}</button></div>`).join('')}</div>
      <div class="add-inline"><input id="newFuType" placeholder="Add follow-up type"><button class="btn btn-sm btn-primary" onclick="addToList('followupTypes','newFuType')">Add</button></div>
    </div>
    <div class="panel"><div class="panel-title">Areas</div>
      <div class="settings-list">${s.areas.map(t=>`<div class="settings-tag">${esc(t)}<button onclick="removeFromList('areas','${esc(t)}')">${icon('x')}</button></div>`).join('')}</div>
      <div class="add-inline"><input id="newAreaS" placeholder="Add area"><button class="btn btn-sm btn-primary" onclick="addToList('areas','newAreaS')">Add</button></div>
    </div>
    <div class="panel">
      <div class="panel-title" style="margin-bottom:10px">Cloud Access &amp; Security</div>
      <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.6">
        This edition stores all data in Cloud Firestore and requires Google Sign-In. Only the Gmail addresses listed in <span class="mono">ALLOWED_EMAILS</span> near the top of the file's script can sign in and see this data — everyone else is turned away at the login screen automatically.<br><br>
        To add or remove a team member: edit <span class="mono">ALLOWED_EMAILS</span> in the HTML file <b>and</b> update your Firestore security rules to match (below), then re-save/re-upload the file.
      </p>
      <div class="table-wrap" style="margin-top:12px"><table><tbody>
        <tr><td style="white-space:pre-wrap;font-family:var(--font-mono);font-size:11.5px;line-height:1.6">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /plymaster_crm/shared_data {
      allow read, write: if request.auth != null
        && request.auth.token.email in [
          "you@gmail.com",
          "your.sales.exec@gmail.com"
        ];
    }
  }
}</td></tr>
      </tbody></table></div>
      <p style="font-size:11.5px;color:var(--ink-faint);margin-top:8px">Paste this into Firebase Console → Firestore Database → Rules, keeping the email list identical to <span class="mono">ALLOWED_EMAILS</span> in the HTML file.</p>
    </div>
    <div class="panel">
      <div class="panel-title" style="margin-bottom:10px">Deployment Notes</div>
      <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.6">
        Because Google Sign-In needs your project's authorised domain, this file works best hosted on a real URL (Firebase Hosting, GitHub Pages, your own website, or a Blogger custom domain) rather than opened straight from disk. Add that domain under Firebase Console → Authentication → Settings → Authorized domains.<br><br>
        If you'd rather keep everything on one device with zero setup, use the standard (non-cloud) Ply Master CRM file instead — it works offline and pastes directly into Blogger.
      </p>
    </div>
  `;
}
function saveProfile(){
  DB.settings.businessName = document.getElementById('s_name').value.trim()||'PLY MASTER';
  DB.settings.subtitle = document.getElementById('s_sub').value.trim();
  DB.settings.currency = document.getElementById('s_currency').value.trim()||'₹';
  DB.settings.dateFormat = document.getElementById('s_dateformat').value.trim();
  saveDB();
  document.getElementById('brandNameEl').textContent = DB.settings.businessName;
  document.getElementById('brandSubEl').textContent = DB.settings.subtitle;
  toast('Business profile saved.');
}
function addToList(listKey, inputId){
  const v = document.getElementById(inputId).value.trim();
  if(!v) return;
  if(!DB.settings[listKey].includes(v)) DB.settings[listKey].push(v);
  saveDB(); render();
}
function removeFromList(listKey, val){
  DB.settings[listKey] = DB.settings[listKey].filter(x=>x!==val);
  saveDB(); render();
}

/* ============================================================
   OVERLAY / CONFIRM / TOGGLES
   ============================================================ */
function showOverlay(html){ const o=document.getElementById('overlayRoot'); o.innerHTML=html; o.classList.add('show'); }
function closeOverlay(){ const o=document.getElementById('overlayRoot'); o.classList.remove('show'); o.innerHTML=''; }
function showConfirm(title, body, onYes){
  showOverlay(`
    <div class="modal modal-sm">
      <div class="modal-head"><h3 class="modal-title">${esc(title)}</h3></div>
      <div class="modal-body"><p style="margin:0;font-size:13.5px;color:var(--ink-soft)">${esc(body)}</p></div>
      <div class="modal-foot"><button class="btn" onclick="closeOverlay()">Cancel</button><button class="btn btn-danger" id="confirmYesBtn">Delete</button></div>
    </div>
  `);
  document.getElementById('confirmYesBtn').onclick = onYes;
}
document.getElementById('overlayRoot').addEventListener('click', e=>{ if(e.target.id==='overlayRoot') closeOverlay(); });
function toggleFabMenu(force){
  const m = document.getElementById('fabMenu');
  if(force===false){ m.classList.remove('show'); return; }
  m.classList.toggle('show');
}
document.addEventListener('click', e=>{
  const fab = document.getElementById('fabMenu');
  if(fab.classList.contains('show') && !e.target.closest('.fab') && !e.target.closest('.fab-menu')) fab.classList.remove('show');
});
function toggleTheme(){
  DB.settings.theme = DB.settings.theme==='dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', DB.settings.theme);
  document.getElementById('themeSwitch').classList.toggle('on', DB.settings.theme==='dark');
  saveDB();
  if(state.page==='reports') drawCharts();
}

init();
</script>
</body>
</html>
