<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ply Master CRM — Cloud Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#FAF9F5;
  --surface:#FFFFFF;
  --surface-2:#F3F0E8;
  --ink:#221D17;
  --ink-soft:#5C554A;
  --ink-faint:#8B8375;
  --border:#E5DFD1;
  --border-strong:#D8CFBB;
  --timber:#9C5B34;
  --timber-dark:#7A4527;
  --timber-tint:#F3E6DA;
  --sage:#54725A;
  --sage-tint:#E4EEE3;
  --amber:#B9781F;
  --amber-tint:#F7E9D3;
  --red:#AE3B32;
  --red-tint:#F5DEDA;
  --blue:#3E6E93;
  --blue-tint:#DFEAF1;
  --violet:#6C5B8A;
  --violet-tint:#E9E4F1;
  --gray-tint:#EAE7DF;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(34,29,23,0.06), 0 1px 1px rgba(34,29,23,0.04);
  --font-ui:'Manrope',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
[data-theme="dark"]{
  --bg:#17140F;
  --surface:#211D17;
  --surface-2:#2A251D;
  --ink:#F3EFE6;
  --ink-soft:#C7BFAE;
  --ink-faint:#8B8375;
  --border:#3A3428;
  --border-strong:#463F30;
  --timber-tint:#3A2A1D;
  --sage-tint:#233024;
  --amber-tint:#332711;
  --red-tint:#3A211E;
  --blue-tint:#1C2C36;
  --violet-tint:#292236;
  --gray-tint:#2C2820;
  --shadow:0 1px 2px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:inherit;}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-0.01em;}
.mono{font-family:var(--font-mono);}
::selection{background:var(--timber-tint);}

/* ============ APP SHELL ============ */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:222px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--border);}
.brand-mark{display:flex;align-items:center;gap:10px;}
.brand-logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(155deg,var(--timber),var(--timber-dark));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-logo svg{width:19px;height:19px;}
.brand-name{font-size:16.5px;font-weight:800;line-height:1.1;}
.brand-sub{font-size:11px;color:var(--ink-faint);margin-top:3px;line-height:1.3;}

.nav{flex:1;overflow-y:auto;padding:10px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--ink-soft);font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:2px;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:0.85;}
.nav-item:hover{background:var(--surface-2);color:var(--ink);}
.nav-item.active{background:var(--timber-tint);color:var(--timber-dark);}
[data-theme="dark"] .nav-item.active{color:#E3A97D;}
.nav-count{margin-left:auto;font-size:11px;font-family:var(--font-mono);background:var(--gray-tint);padding:1px 6px;border-radius:20px;color:var(--ink-soft);}
.nav-count.hot{background:var(--red-tint);color:var(--red);}

.sidebar-foot{padding:12px;border-top:1px solid var(--border);}
.theme-toggle{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-soft);padding:6px 8px;}
.switch{width:34px;height:19px;border-radius:20px;background:var(--border-strong);position:relative;cursor:pointer;flex-shrink:0;}
.switch::after{content:'';position:absolute;width:15px;height:15px;border-radius:50%;background:var(--surface);top:2px;left:2px;transition:transform .15s;}
.switch.on{background:var(--timber);}
.switch.on::after{transform:translateX(15px);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:14px 24px;backdrop-filter:blur(6px);
}
.search-wrap{flex:1;max-width:420px;position:relative;}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint);}
.search-input{width:100%;padding:9px 12px 9px 34px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);outline:none;font-size:13.5px;}
.search-input:focus{border-color:var(--timber);}
.topbar-spacer{flex:1;}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-2);}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--timber);border-color:var(--timber);color:#fff;}
.btn-primary:hover{background:var(--timber-dark);}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff;}
.btn-danger:hover{opacity:0.9;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 10px;font-size:12px;}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.icon-btn svg{width:16px;height:16px;}
.icon-btn:hover{background:var(--surface-2);}

.content{padding:22px 24px 90px;max-width:1400px;width:100%;}
.page{display:none;}
.page.active{display:block;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:21px;}
.page-desc{color:var(--ink-faint);font-size:13px;margin-top:3px;}

/* ============ CARDS / GRID ============ */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-bottom:22px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;}
.stat-card:hover{border-color:var(--border-strong);}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.stat-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.stat-icon svg{width:15px;height:15px;}
.stat-num{font-family:var(--font-mono);font-size:24px;font-weight:600;line-height:1;}
.stat-label{font-size:12px;color:var(--ink-faint);margin-top:5px;font-weight:600;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-title{font-size:14.5px;font-weight:700;}
.panel-title .count{color:var(--ink-faint);font-weight:600;font-family:var(--font-mono);font-size:12px;}

.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
@media(max-width:980px){.two-col{grid-template-columns:1fr;}}

.work-item{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--border);}
.work-item:last-child{border-bottom:none;}
.work-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.work-main{flex:1;min-width:0;}
.work-name{font-weight:700;font-size:13.5px;}
.work-sub{font-size:12px;color:var(--ink-faint);margin-top:1px;}
.empty-row{padding:18px 4px;color:var(--ink-faint);font-size:13px;text-align:center;}

/* ============ BADGES ============ */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.b-gray{background:var(--gray-tint);color:var(--ink-soft);}
.b-blue{background:var(--blue-tint);color:var(--blue);}
.b-violet{background:var(--violet-tint);color:var(--violet);}
.b-amber{background:var(--amber-tint);color:var(--amber);}
.b-red{background:var(--red-tint);color:var(--red);}
.b-sage{background:var(--sage-tint);color:var(--sage);}
.b-dark{background:var(--ink);color:var(--bg);}
.prio-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}
.prio-High{background:var(--red);}
.prio-Medium{background:var(--amber);}
.prio-Low{background:var(--ink-faint);}

/* ============ FILTER BAR ============ */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.filter-bar select,.filter-bar input[type=date]{
  padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);font-size:12.5px;font-weight:600;
}
.view-toggle{display:flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;margin-left:auto;}
.view-toggle button{border:none;background:var(--surface);padding:7px 11px;cursor:pointer;}
.view-toggle button.active{background:var(--timber);color:#fff;}

/* ============ TABLE ============ */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px;}
th{text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);border-bottom:1px solid var(--border);font-weight:700;background:var(--surface-2);white-space:nowrap;cursor:pointer;}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.cell-strong{font-weight:700;}
.cell-sub{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
.row-actions{display:flex;gap:5px;}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:12.5px;color:var(--ink-faint);}
.pagination button{border:1px solid var(--border-strong);background:var(--surface);padding:5px 10px;border-radius:var(--radius-sm);cursor:pointer;}

/* ============ CARD VIEW (leads) ============ */
.lead-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.lead-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.lc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.lc-name{font-weight:700;font-size:14px;}
.lc-type{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
.lc-meta{margin-top:10px;font-size:12.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px;}
.lc-meta span{display:flex;align-items:center;gap:6px;}
.lc-meta svg{width:13px;height:13px;color:var(--ink-faint);flex-shrink:0;}
.lc-foot{margin-top:12px;display:flex;justify-content:space-between;align-items:center;}
.lc-fu{font-size:11.5px;color:var(--ink-faint);}
.lc-actions{display:flex;gap:6px;margin-top:10px;}

/* ============ MODALS ============ */
.overlay{position:fixed;inset:0;background:rgba(20,17,12,0.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal.modal-sm{max-width:420px;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:2;}
.modal-title{font-size:16px;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.form-grid.full,.field.full{grid-column:1/-1;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg);outline:none;font-size:13px;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--timber);}
.field textarea{resize:vertical;min-height:60px;}
.chip-select{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--border-strong);font-size:12px;font-weight:600;cursor:pointer;background:var(--surface);}
.chip.on{background:var(--timber);border-color:var(--timber);color:#fff;}

/* ============ LEAD DETAIL ============ */
.detail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.detail-name{font-size:19px;}
.detail-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:16px 0;padding:14px;background:var(--surface-2);border-radius:var(--radius-sm);}
.dg-item .dg-label{font-size:10.5px;text-transform:uppercase;color:var(--ink-faint);font-weight:700;letter-spacing:.03em;}
.dg-item .dg-value{font-size:13px;font-weight:600;margin-top:3px;}
.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:16px 0 0;}
.tab{padding:9px 4px;margin-right:16px;font-size:13px;font-weight:700;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--ink);border-color:var(--timber);}
.tab-panel{display:none;padding:16px 0;}
.tab-panel.active{display:block;}
.timeline{position:relative;padding-left:18px;}
.timeline::before{content:'';position:absolute;left:4px;top:4px;bottom:4px;width:1px;background:var(--border-strong);}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item::before{content:'';position:absolute;left:-18px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--timber);}
.tl-date{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);}
.tl-text{font-size:13px;margin-top:2px;}
.note-add{display:flex;gap:8px;margin-bottom:14px;}
.note-add textarea{flex:1;}

/* ============ AREAS ============ */
.area-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.area-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;}
.area-card:hover{border-color:var(--timber);}
.area-name{font-weight:700;font-size:15px;}
.area-city{font-size:11.5px;color:var(--ink-faint);}
.area-stats{display:flex;gap:14px;margin:10px 0;font-size:12px;}
.area-stats b{display:block;font-family:var(--font-mono);font-size:15px;font-weight:600;}
.bar-track{height:7px;background:var(--gray-tint);border-radius:20px;overflow:hidden;margin-top:8px;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--sage),var(--timber));border-radius:20px;}
.bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-top:5px;}

/* ============ FUNNEL ============ */
.funnel{display:flex;flex-direction:column;gap:6px;max-width:520px;}
.funnel-row{cursor:pointer;}
.funnel-bar{background:linear-gradient(90deg,var(--timber),var(--timber-dark));color:#fff;padding:9px 14px;border-radius:6px;display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;}
.funnel-row:nth-child(2) .funnel-bar{background:linear-gradient(90deg,#A9713F,#8A5A32);}
.funnel-row:nth-child(3) .funnel-bar{background:linear-gradient(90deg,#B47D48,#93672E);}
.funnel-row:nth-child(4) .funnel-bar{background:linear-gradient(90deg,#8A7150,#6E5A3B);}
.funnel-row:nth-child(5) .funnel-bar{background:linear-gradient(90deg,#6E7454,#565B41);}
.funnel-row:nth-child(6) .funnel-bar{background:linear-gradient(90deg,#54725A,#3F5744);}

/* ============ CALENDAR / SETTINGS LISTS ============ */
.day-group{margin-bottom:16px;}
.day-label{font-size:12px;font-weight:800;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;letter-spacing:.03em;}
.settings-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.settings-tag{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);padding:5px 6px 5px 12px;border-radius:20px;font-size:12.5px;font-weight:600;}
.settings-tag button{border:none;background:none;cursor:pointer;color:var(--ink-faint);width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.settings-tag button:hover{background:var(--red-tint);color:var(--red);}
.add-inline{display:flex;gap:8px;margin-top:12px;max-width:360px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.fab{position:fixed;bottom:26px;right:26px;width:54px;height:54px;border-radius:50%;background:var(--timber);color:#fff;border:none;box-shadow:0 8px 20px rgba(156,91,52,0.4);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:30;}
.fab svg{width:24px;height:24px;}
.fab-menu{position:fixed;bottom:88px;right:26px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.15);padding:6px;display:none;flex-direction:column;z-index:30;min-width:190px;}
.fab-menu.show{display:flex;}
.fab-menu button{border:none;background:none;text-align:left;padding:10px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;}
.fab-menu button:hover{background:var(--surface-2);}

.chart-box{position:relative;height:260px;}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:980px){.report-grid{grid-template-columns:1fr;}}

.bottom-nav{display:none;}

/* ============ MOBILE ============ */
@media(max-width:900px){
  .sidebar{display:none;}
  .content{padding:16px 14px 90px;}
  .topbar{padding:12px 14px;}
  .form-grid{grid-template-columns:1fr;}
  .two-col,.report-grid{grid-template-columns:1fr;}
  table{min-width:700px;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);
    z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;background:none;border:none;color:var(--ink-faint);font-size:10px;font-weight:700;}
  .bn-item.active{color:var(--timber-dark);}
  .bn-item svg{width:19px;height:19px;}
  .fab{bottom:78px;}
  .fab-menu{bottom:140px;}
}
.hidden{display:none !important;}

/* ===== LOGIN GATE ===== */
#loginGate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:34px 30px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.08);}
.login-logo{width:52px;height:52px;border-radius:12px;background:linear-gradient(155deg,var(--timber),var(--timber-dark));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.login-logo svg{width:28px;height:28px;}
.login-title{font-size:19px;font-weight:800;}
.login-sub{font-size:12.5px;color:var(--ink-faint);margin-top:6px;line-height:1.5;}
.gsi-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);font-weight:700;font-size:13.5px;cursor:pointer;margin-top:22px;}
.gsi-btn:hover{background:var(--surface-2);}
.gsi-btn svg{width:18px;height:18px;}
.login-status{font-size:12px;color:var(--ink-faint);margin-top:14px;min-height:16px;}
.login-denied{background:var(--red-tint);color:var(--red);border-radius:8px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-top:16px;text-align:left;}
</style>
</head>
<body>
<div id="loginGate">
  <div class="login-card">

<script>
/* =====================================================================
   PLY MASTER CRM — CLOUD EDITION (Firebase Auth + Cloud Firestore)
   =====================================================================
   SETUP — do this before publishing:
   1. Create a Firebase project at https://console.firebase.google.com
   2. Enable Authentication → Sign-in method → Google.
   3. Enable Firestore Database (Production mode).
   4. Project settings → General → "Your apps" → Add a Web app → copy the
      config object below into FIREBASE_CONFIG.
   5. List every Gmail address allowed to use this CRM in ALLOWED_EMAILS.
   6. Paste the matching Firestore rules (see the README panel in Settings
      after you sign in) into Firestore → Rules, using the SAME email list.
   ===================================================================== */

const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

// Only these Gmail accounts will be allowed to sign in and see your data.
const ALLOWED_EMAILS = [
  "you@gmail.com",
  "your.sales.exec@gmail.com"
];

// Single shared document all authorised users read/write — the whole team
// sees the same leads, follow-ups, payments and orders.
const FS_COLLECTION = "plymaster_crm";
const FS_DOC = "shared_data";

let fbApp, auth, db, currentUser = null, unsubscribeSnapshot = null, saveTimer = null;

function initFirebase(){
  fbApp = firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
  auth.onAuthStateChanged(onAuthChange);
}
function signIn(){
  const provider = new firebase.auth.GoogleAuthProvider();
  document.getElementById('loginStatus').textContent = 'Opening Google sign-in…';
  auth.signInWithPopup(provider).catch(err=>{
    document.getElementById('loginStatus').textContent = 'Sign-in failed: ' + err.message;
  });
}
function signOutUser(){
  if(unsubscribeSnapshot) unsubscribeSnapshot();
  auth.signOut();
}
function onAuthChange(user){
  const denied = document.getElementById('deniedBox');
  const status = document.getElementById('loginStatus');
  denied.innerHTML = ''; status.textContent = '';
  if(!user){
    currentUser = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginGate').classList.remove('hidden');
    return;
  }
  const email = (user.email||'').toLowerCase();
  const allowed = ALLOWED_EMAILS.map(e=>e.toLowerCase()).includes(email);
  if(!allowed){
    denied.innerHTML = `<div class="login-denied">Signed in as <b>${esc(user.email)}</b> — this account is not on the authorised list for this CRM. Ask the business owner to add it in Settings → ALLOWED_EMAILS, and in Firestore Rules, then sign in again.</div>
      <button class="btn btn-sm" style="margin-top:12px" onclick="signOutUser()">Sign out</button>`;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginGate').classList.remove('hidden');
    return;
  }
  currentUser = user;
  document.getElementById('loginGate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const badge = document.getElementById('signedInAs');
  if(badge) badge.textContent = 'Sign out (' + user.email + ')';
  subscribeToData();
}
function subscribeToData(){
  const ref = db.collection(FS_COLLECTION).doc(FS_DOC);
  unsubscribeSnapshot = ref.onSnapshot(snap=>{
    if(snap.exists){
      DB = snap.data().payload;
      migrateDB();
    } else {
      DB = seedDB();
      ref.set({payload: DB, updatedAt: new Date().toISOString()});
    }
    document.body.setAttribute('data-theme', DB.settings.theme || 'light');
    document.getElementById('themeSwitch').classList.toggle('on', DB.settings.theme==='dark');
    document.getElementById('brandNameEl').textContent = DB.settings.businessName;
    document.getElementById('brandSubEl').textContent = DB.settings.subtitle;
    renderNav();
    render();
  }, err=>{
    toast('Sync error: ' + err.message);
  });
}
// Overrides the localStorage saveDB from the base app — writes to Firestore
// instead, debounced slightly so rapid edits don't spam the network.
function saveDB(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    db.collection(FS_COLLECTION).doc(FS_DOC).set({
      payload: DB, updatedAt: new Date().toISOString(), updatedBy: currentUser ? currentUser.email : 'unknown'
    }).catch(err=>toast('Could not save: '+err.message));
  }, 250);
}


// (No local storage key needed — this edition stores data in Firestore.)
const todayISO = () => new Date().toISOString().slice(0,10);
const uid = (p='L') => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function addDays(iso, n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function esc(s){ return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const w=document.getElementById('toastWrap'); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; w.appendChild(t); setTimeout(()=>t.remove(),3200); }

/* ---------------- DEFAULT SETTINGS ---------------- */
const DEFAULT_BUSINESS_TYPES = ['Plywood Dealer','Plywood Shop','Timber Dealer','Hardware Dealer','Furniture Shop','Interior Designer','Interior Contractor','Modular Kitchen','Modular Furniture','Carpenter','Architect','Builder','Contractor','Other'];
const DEFAULT_PRODUCTS = ['Commercial Plywood','BWP Plywood','Marine Plywood','Birch Plywood','Gurjan Plywood','Alternate Plywood','Shuttering Plywood','Flexi Plywood','Block Board','Finger Joint Board','WPC Board','PVC Board','WPVC Board','NFC Board','NWFC Board','HDHMR Board','OSB Board','Veneer','Relwood','Vegan Wood','Indiwud NFC','Other'];
const DEFAULT_TAGS = ['VIP','Regular Buyer','New Shop','High Potential','Bulk Buyer','Interior Network','Modular Network','Price Sensitive','Sample Required','Catalogue Sent'];
const DEFAULT_FOLLOWUP_TYPES = ['Price Discussion','Sample Follow-Up','Catalogue Sent','Quotation Follow-Up','Payment Reminder','Order Confirmation','Relationship Call','New Introduction'];
const DEFAULT_AREAS = ['Attapur','Kattedan','Mehdipatnam','Tolichowki','Langar Houz','Rajendranagar','Manikonda','Shaikpet','Gachibowli','Narsingi','Kukatpally','Miyapur','Banjara Hills','Jubilee Hills','Dilsukhnagar','LB Nagar'];
const DEFAULT_DISTRICTS = ['Hyderabad Central','Hyderabad West','Hyderabad South','Rangareddy'];
const CATEGORY_MAP = {
  'Plywood Dealer':'Plywood & Timber','Plywood Shop':'Plywood & Timber','Timber Dealer':'Plywood & Timber','Hardware Dealer':'Plywood & Timber',
  'Interior Designer':'Interior & Modular','Interior Contractor':'Interior & Modular','Modular Kitchen':'Interior & Modular','Modular Furniture':'Interior & Modular','Furniture Shop':'Interior & Modular',
};
function categoryOf(businessType){ return CATEGORY_MAP[businessType] || 'Other Trade'; }
function districtOfArea(area){ return (DB.settings.areaDistrict||{})[area] || 'Unassigned'; }
const STATUS_LIST = ['Yet to Contact','Contacted','Interested','Follow-Up Required','Follow-Up Completed','Meeting Scheduled','Sample Given','Quotation Given','Order Expected','Converted','Not Interested','Lost','Inactive'];
const STATUS_BADGE = {
  'Yet to Contact':'b-gray','Contacted':'b-blue','Interested':'b-violet','Follow-Up Required':'b-amber',
  'Follow-Up Completed':'b-sage','Meeting Scheduled':'b-blue','Sample Given':'b-amber','Quotation Given':'b-amber',
  'Order Expected':'b-amber','Converted':'b-sage','Not Interested':'b-dark','Lost':'b-red','Inactive':'b-dark'
};
const RESULT_OPTIONS = ['Interested','Need More Information','Send Catalogue','Send Price List','Send Samples','Meeting Required','Quotation Required','Order Expected','Call Again','Not Interested'];

/* ---------------- STATE ---------------- */
let DB = null;
// loadDB() is not used in the cloud edition — data comes from subscribeToData() via Firestore onSnapshot.
function migrateDB(){
  DB.settings = Object.assign({
    businessName:'PLY MASTER', subtitle:'Dealer & Interior Business CRM', theme:'light',
    areas:DEFAULT_AREAS.slice(), businessTypes:DEFAULT_BUSINESS_TYPES.slice(),
    products:DEFAULT_PRODUCTS.slice(), tags:DEFAULT_TAGS.slice(), followupTypes:DEFAULT_FOLLOWUP_TYPES.slice(),
    districts:DEFAULT_DISTRICTS.slice(), areaDistrict:{},
    currency:'₹', dateFormat:'DD MMM YYYY'
  }, DB.settings||{});
  DB.settings.areaDistrict = DB.settings.areaDistrict || {};
  DB.settings.districts = DB.settings.districts || DEFAULT_DISTRICTS.slice();
  DB.leads = DB.leads||[]; DB.visits = DB.visits||[]; DB.activity = DB.activity||[]; DB.notices = DB.notices||[];
  DB.leads.forEach(l=>{ l.payments = l.payments||[]; l.orders = l.orders||[]; });
}
// NOTE: saveDB() for this edition is defined earlier (writes to Firestore instead of localStorage).
function logActivity(text){ DB.activity.unshift({date:new Date().toISOString(), text}); DB.activity=DB.activity.slice(0,300); }

function seedDB(){
  const areas = DEFAULT_AREAS.slice();
  const types = ['Plywood Dealer','Plywood Dealer','Interior Designer','Modular Kitchen','Timber Dealer','Hardware Dealer','Architect','Carpenter','Furniture Shop','Contractor'];
  const names = ['ABC Plywood','Sri Balaji Plywoods','Modern Modular','Design Nest Interiors','Sai Timber Depot','Home Craft Interiors','Elite Modular Kitchens','Deccan Hardware','New Sitara Plywood House','Urban Space Interiors','Ramesh Carpentry Works','Sri Sai Furniture','Classic Plywood Emporium','Trendy Interiors','Aakruti Modular','Anand Timbers','Precision Builders','Green Wood Plywood','Vinayaka Hardware','Nova Interior Studio'];
  const contacts = ['Ramesh','Suresh','Priya','Kiran','Mahesh','Anjali','Farhan','Lakshmi','Naveen','Sandeep','Ravi','Divya','Imran','Swathi','Bharath','Vikram','Meena','Rahul','Sunitha','Arjun'];
  const statusesPool = ['Yet to Contact','Contacted','Interested','Follow-Up Required','Quotation Given','Converted','Not Interested','Sample Given','Meeting Scheduled'];
  const leads = [];
  for(let i=0;i<48;i++){
    const area = areas[i % areas.length];
    const type = types[i % types.length];
    const status = statusesPool[Math.floor(Math.random()*statusesPool.length)];
    const contacted = status !== 'Yet to Contact';
    const lastContact = contacted ? addDays(todayISO(), -Math.floor(Math.random()*30)) : '';
    const needsFollowup = ['Contacted','Interested','Follow-Up Required','Sample Given','Quotation Given','Meeting Scheduled'].includes(status);
    const nextFollowUp = needsFollowup ? addDays(todayISO(), Math.floor(Math.random()*10)-3) : '';
    const prods = [];
    const pcount = 1+Math.floor(Math.random()*3);
    for(let p=0;p<pcount;p++){ const pr = DEFAULT_PRODUCTS[Math.floor(Math.random()*DEFAULT_PRODUCTS.length)]; if(!prods.includes(pr)) prods.push(pr); }
    leads.push({
      id: uid(), businessName: names[i % names.length] + (i>=names.length?' '+(Math.floor(i/names.length)+1):''),
      businessType: type, contactPerson: contacts[i % contacts.length], phone: '9' + (700000000+Math.floor(Math.random()*99999999)),
      whatsapp:'', altPhone:'', email:'', address:'', area, city:'Hyderabad', pincode:'',
      mapsLink:'https://maps.google.com/?q='+encodeURIComponent(area+' Hyderabad'), website:'', instagram:'', facebook:'',
      products:prods, source:'Field Visit', priority: ['High','Medium','Low'][Math.floor(Math.random()*3)],
      status, tags: Math.random()>0.7 ? [DEFAULT_TAGS[Math.floor(Math.random()*DEFAULT_TAGS.length)]] : [],
      lastContactDate:lastContact, nextFollowUpDate: nextFollowUp, followUpReason: needsFollowup ? 'Discuss pricing & samples' : '',
      notes:[], history: contacted ? [{date:lastContact,type:'Call',status,note:'Initial contact made.'}] : [],
      payments:[], orders:[],
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), deleted:false
    });
  }
  // sample payments on a few converted / quotation-stage leads
  leads.filter(l=>['Converted','Quotation Given','Order Expected'].includes(l.status)).slice(0,6).forEach((l,i)=>{
    l.payments.push({ id:uid('P'), amount: 15000+i*8000, dueDate: addDays(todayISO(), i%3===0 ? -4 : i), status: i%3===0?'Pending':'Pending', note:'Balance after advance received.', createdAt:new Date().toISOString() });
  });
  // sample orders on converted leads
  leads.filter(l=>l.status==='Converted').slice(0,4).forEach((l,i)=>{
    l.orders.push({ id:uid('O'), orderValue: 40000+i*15000, products:(l.products||[]).join(', '), orderDate: addDays(todayISO(),-i*3), expectedClosing: addDays(todayISO(), 5-i), status: i===0?'Closed - Won':'Open', note:'', createdAt:new Date().toISOString() });
  });
  return {
    settings:{ businessName:'PLY MASTER', subtitle:'Dealer & Interior Business CRM', theme:'light',
      areas, businessTypes:DEFAULT_BUSINESS_TYPES.slice(), products:DEFAULT_PRODUCTS.slice(), tags:DEFAULT_TAGS.slice(),
      followupTypes:DEFAULT_FOLLOWUP_TYPES.slice(), districts:DEFAULT_DISTRICTS.slice(),
      areaDistrict: Object.fromEntries(areas.map((a,i)=>[a, DEFAULT_DISTRICTS[i % DEFAULT_DISTRICTS.length]])),
      currency:'₹', dateFormat:'DD MMM YYYY' },
    leads, visits:[],
    notices:[
      {id:uid('N'), title:'Diwali offer pricing', note:'Announce festive discount on BWP plywood to all Interested leads before the 10th.', reminderDate: addDays(todayISO(),2), done:false, createdAt:new Date().toISOString()},
      {id:uid('N'), title:'New HDHMR stock arrived', note:'Inform modular kitchen clients — new HDHMR board stock is in.', reminderDate: addDays(todayISO(),-1), done:false, createdAt:new Date().toISOString()}
    ],
    activity:[{date:new Date().toISOString(), text:'Sample data loaded — 48 demo leads across 16 areas.'}]
  };
}

const NAV = [

  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.14-1.4l2-1.55-2-3.46-2.36.95a7 7 0 00-2.4-1.4L13.6 3h-3.2l-.5 2.14a7 7 0 00-2.4 1.4l-2.36-.95-2 3.46 2 1.55A7 7 0 004.5 12c0 .47.05.93.14 1.4l-2 1.55 2 3.46 2.36-.95c.7.62 1.53 1.1 2.4 1.4l.5 2.14h3.2l.5-2.14c.87-.3 1.7-.78 2.4-1.4l2.36.95 2-3.46-2-1.55c.09-.47.14-.93.14-1.4z"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14" r="1.2"/>',
  box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v9l9 5 9-5V8"/><path d="M12 13v9"/>',
  bell:'<path d="M6 9a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 004 0"/>',

function icon(name,cls){ return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`; }

let state = { page:'dashboard', search:'', leadFilters:{}, leadView:'table', leadSort:{key:'updatedAt',dir:-1}, leadPage:1, pageSize:12, detailLeadId:null, detailTab:'history' };

/* ---------------- INIT ---------------- */
function init(){
  initFirebase();
}
function renderNav(){
  const counts = navCounts();
  document.getElementById('navList').innerHTML = NAV.map(n=>`
    <button class="nav-item ${state.page===n.id?'active':''}" onclick="goPage('${n.id}')">
      ${icon(n.icon)}<span>${n.label}</span>
      ${counts[n.id]!==undefined ? `<span class="nav-count ${counts[n.id+'Hot']?'hot':''}">${counts[n.id]}</span>`:''}
    </button>`).join('');
  document.getElementById('bottomNav').innerHTML = ['dashboard','leads','followups','payments'].map(id=>{
    const n = NAV.find(x=>x.id===id);
    return `<button class="bn-item ${state.page===id?'active':''}" onclick="goPage('${id}')">${icon(n.icon)}<span>${n.label.replace(' Due','')}</span></button>`;
  }).join('') + `<button class="bn-item" onclick="openMoreMenu()">${icon('menu')}<span>More</span></button>`;
}
function navCounts(){
  const leads = activeLeads();
  const overdue = leads.filter(isOverdue).length;
  const today = leads.filter(isDueToday).length;
  const pays = allPayments().filter(p=>p.status==='Pending');
  const payOverdue = pays.filter(isPaymentOverdue).length;
  const openOrders = allOrders().filter(o=>o.status==='Open').length;
  const noticesDue = DB.notices.filter(n=>!n.done && (isNoticeOverdue(n)||isNoticeDueToday(n))).length;
  return {
    leads: leads.length,
    followups: today+overdue, followupsHot: overdue>0,
    payments: pays.length, paymentsHot: payOverdue>0,
    orders: openOrders,
    notices: noticesDue, noticesHot: DB.notices.some(isNoticeOverdue),
    trash: DB.leads.filter(l=>l.deleted).length
  };
}
function goPage(p){ state.page=p; state.detailLeadId=null; renderNav(); render(); window.scrollTo(0,0); }
function openMoreMenu(){
  const rest = ['areas','orders','notices','visits','reports','importexport','trash','settings'];
  showOverlay(`
    <div class="modal modal-sm">
      <div class="modal-head"><h3 class="modal-title">More</h3><button class="icon-btn" onclick="closeOverlay()">${icon('x')}</button></div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:2px;padding:10px">
        ${rest.map(id=>{ const n=NAV.find(x=>x.id===id); return `<button class="nav-item" style="padding:12px" onclick="closeOverlay();goPage('${id}')">${icon(n.icon)}<span>${n.label}</span></button>`; }).join('')}
      </div>
    </div>
  `);
}

/* ---------------- HELPERS ---------------- */
function activeLeads(){ return DB.leads.filter(l=>!l.deleted); }
function isOverdue(l){ return l.nextFollowUpDate && l.nextFollowUpDate < todayISO() && !['Converted','Not Interested','Lost'].includes(l.status); }
function isDueToday(l){ return l.nextFollowUpDate === todayISO() && !['Converted','Not Interested','Lost'].includes(l.status); }
function isUpcoming(l){ return l.nextFollowUpDate && l.nextFollowUpDate > todayISO() && !['Converted','Not Interested','Lost'].includes(l.status); }
function allPayments(){ const out=[]; activeLeads().forEach(l=>(l.payments||[]).forEach(p=>out.push(Object.assign({},p,{leadId:l.id, leadName:l.businessName, area:l.area, phone:l.phone})))); return out; }
function isPaymentOverdue(p){ return p.status==='Pending' && p.dueDate && p.dueDate<todayISO(); }
function isPaymentDueToday(p){ return p.status==='Pending' && p.dueDate===todayISO(); }
function allOrders(){ const out=[]; activeLeads().forEach(l=>(l.orders||[]).forEach(o=>out.push(Object.assign({},o,{leadId:l.id, leadName:l.businessName, area:l.area, phone:l.phone})))); return out; }
function isNoticeOverdue(n){ return !n.done && n.reminderDate && n.reminderDate<todayISO(); }
function isNoticeDueToday(n){ return !n.done && n.reminderDate===todayISO(); }

/* ---------------- RENDER ROUTER ---------------- */
function render(){
  const root = document.getElementById('contentRoot');
  const pages = { dashboard:renderDashboard, leads:renderLeads, areas:renderAreas, followups:renderFollowups,
    payments:renderPayments, orders:renderOrders, notices:renderNotices,
    visits:renderVisits, reports:renderReports, importexport:renderImportExport, trash:renderTrash, settings:renderSettings };
  root.innerHTML = state.detailLeadId ? renderLeadDetail(state.detailLeadId) : (pages[state.page]||renderDashboard)();
  if(state.page==='reports' && !state.detailLeadId) drawCharts();
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard(){
  const leads = activeLeads();
  const total = leads.length;
  const contacted = leads.filter(l=>l.status!=='Yet to Contact').length;
  const yetToContact = total-contacted;
  const dueToday = leads.filter(isDueToday).length;
  const overdue = leads.filter(isOverdue).length;
  const completed = leads.reduce((a,l)=>a+(l.history||[]).filter(h=>h.type==='Follow-Up').length,0);
  const interested = leads.filter(l=>l.status==='Interested').length;
  const converted = leads.filter(l=>l.status==='Converted').length;
  const lost = leads.filter(l=>['Not Interested','Lost','Inactive'].includes(l.status)).length;
  const areaSet = new Set(leads.map(l=>l.area).filter(Boolean));
  const areasCovered = [...areaSet].filter(a=>leads.some(l=>l.area===a && l.status!=='Yet to Contact')).length;
  const areasPending = DB.settings.areas.length - areasCovered;
  const pays = allPayments().filter(p=>p.status==='Pending');
  const paysOverdue = pays.filter(isPaymentOverdue).length;
  const openOrders = allOrders().filter(o=>o.status==='Open');
  const noticesDue = DB.notices.filter(n=>!n.done && (isNoticeOverdue(n)||isNoticeDueToday(n)));

  const cards = [
    ['Total Leads', total, 'users','blue', ()=>filterAndGo({})],
    ['Contacted', contacted, 'check','sage', ()=>filterAndGo({contact:'contacted'})],
    ['Yet to Contact', yetToContact, 'clock','gray', ()=>filterAndGo({contact:'pending'})],
    ['Follow-Up Today', dueToday, 'clock','amber', ()=>{goPage('followups');}],
    ['Overdue Follow-Ups', overdue, 'clock','red', ()=>{goPage('followups');}],
    ['Follow-Ups Completed', completed, 'check','sage', ()=>{goPage('followups');}],
    ['Payments Pending', pays.length, 'wallet','amber', ()=>goPage('payments')],
    ['Payments Overdue', paysOverdue, 'wallet','red', ()=>goPage('payments')],
    ['Open Orders (Closing)', openOrders.length, 'box','blue', ()=>goPage('orders')],
    ['Notices Due', noticesDue.length, 'bell','violet', ()=>goPage('notices')],
    ['Interested', interested, 'users','violet', ()=>filterAndGo({status:'Interested'})],
    ['Converted', converted, 'check','sage', ()=>filterAndGo({status:'Converted'})],
    ['Lost / Not Interested', lost, 'x','red', ()=>filterAndGo({status:'Lost'})],
    ['Areas Covered', areasCovered, 'map','sage', ()=>goPage('areas')],
    ['Areas Pending', areasPending, 'map','amber', ()=>goPage('areas')],
  ];
  const todays = leads.filter(l=>isDueToday(l)||isOverdue(l)).sort((a,b)=>(a.nextFollowUpDate||'').localeCompare(b.nextFollowUpDate||''));
  const pending = leads.filter(l=>l.status==='Yet to Contact').slice(0,6);
  const highPrio = leads.filter(l=>l.priority==='High' && l.status!=='Converted').slice(0,6);

  return `
    <div class="page-head">
      <div><h1 class="page-title">Today's Work</h1><div class="page-desc">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div>
    </div>
    <div class="stat-grid">
      ${cards.map(([label,num,ic,tone,fn])=>{
        const id = 'sc'+Math.random().toString(36).slice(2,8);
        window['__click_'+id]=fn;
        return `<div class="stat-card" onclick="window.__click_${id}()">
          <div class="stat-top"><div class="stat-icon" style="background:var(--${tone}-tint);color:var(--${tone==='gray'?'ink-soft':tone});">${icon(ic)}</div></div>
          <div class="stat-num">${num}</div><div class="stat-label">${label}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Everything Due Today &amp; Overdue <span class="count">${todays.length+pays.filter(isPaymentOverdue).length+pays.filter(isPaymentDueToday).length+noticesDue.length}</span></div></div>
      ${combinedReminders(todays,pays,noticesDue)}
    </div>
    <div class="two-col">
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Follow-Ups Only <span class="count">${todays.length}</span></div><button class="btn btn-ghost btn-sm" onclick="goPage('followups')">View all</button></div>
        ${todays.length? todays.slice(0,8).map(l=>workRow(l)).join('') : '<div class="empty-row">Nothing due today — all caught up.</div>'}
      </div>
      <div class="panel">
        <div class="panel-head"><div class="panel-title">High Priority Leads <span class="count">${highPrio.length}</span></div></div>
        ${highPrio.length? highPrio.map(l=>workRow(l)).join('') : '<div class="empty-row">No high-priority leads pending action.</div>'}
      </div>
    </div>
    <div class="two-col">
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Payments Pending <span class="count">${pays.length}</span></div><button class="btn btn-ghost btn-sm" onclick="goPage('payments')">View all</button></div>
        ${pays.length? pays.slice(0,6).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')).map(p=>paymentRow(p)).join('') : '<div class="empty-row">No pending payments.</div>'}
      </div>
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Notices Due <span class="count">${noticesDue.length}</span></div><button class="btn btn-ghost btn-sm" onclick="goPage('notices')">View all</button></div>
        ${noticesDue.length? noticesDue.slice(0,6).map(n=>noticeRow(n)).join('') : '<div class="empty-row">No notices due right now.</div>'}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Pending First Contact <span class="count">${pending.length ? '' : 0}</span></div><button class="btn btn-ghost btn-sm" onclick="filterAndGo({contact:'pending'})">View all ${yetToContact}</button></div>
      ${pending.length? pending.map(l=>workRow(l)).join('') : '<div class="empty-row">Every lead has been contacted at least once.</div>'}
    </div>
  `;
}
function combinedReminders(todays, pays, noticesDue){
  const items = [];
  todays.forEach(l=>items.push({date:l.nextFollowUpDate, kind:'Follow-Up', overdue:isOverdue(l), title:l.businessName, sub:`${l.businessType} · ${l.area}${l.followUpReason?(' · '+l.followUpReason):''}`, action:`openLeadDetail('${l.id}')`, complete:`openCompleteFollowup('${l.id}')`}));
  pays.forEach(p=>{ if(isPaymentOverdue(p)||isPaymentDueToday(p)) items.push({date:p.dueDate, kind:'Payment', overdue:isPaymentOverdue(p), title:`${p.leadName} — ${DB.settings.currency}${Number(p.amount).toLocaleString('en-IN')}`, sub:p.note||'Payment due', action:`openLeadDetail('${p.leadId}')`, complete:`markPaymentPaid('${p.leadId}','${p.id}')`}); });
  noticesDue.forEach(n=>items.push({date:n.reminderDate, kind:'Notice', overdue:isNoticeOverdue(n), title:n.title, sub:n.note||'', action:`openNoticeModal('${n.id}')`, complete:`markNoticeDone('${n.id}')`}));
  if(!items.length) return '<div class="empty-row">Nothing due today or overdue across follow-ups, payments or notices — all caught up.</div>';
  items.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const kindBadge = {'Follow-Up':'b-blue','Payment':'b-amber','Notice':'b-violet'};
  return items.map(it=>`<div class="work-item">
      <span class="work-dot" style="background:${it.overdue?'var(--red)':'var(--amber)'}"></span>
      <div class="work-main">
        <div class="work-name" style="cursor:pointer" onclick="${it.action}"><span class="badge ${kindBadge[it.kind]}" style="margin-right:6px">${it.kind}</span>${esc(it.title)}</div>
        <div class="work-sub">${esc(it.sub)} · ${it.overdue?'Overdue':'Due'} ${fmtDate(it.date)}</div>
      </div>
      <button class="btn btn-sm" onclick="${it.complete}">Complete</button>
    </div>`).join('');
}
function workRow(l){
  const overdue = isOverdue(l), due = isDueToday(l);
  const dot = overdue ? 'var(--red)' : due ? 'var(--amber)' : 'var(--ink-faint)';
  return `<div class="work-item">
    <span class="work-dot" style="background:${dot}"></span>
    <div class="work-main">
      <div class="work-name" onclick="openLeadDetail('${l.id}')" style="cursor:pointer">${esc(l.businessName)}</div>
      <div class="work-sub">${esc(l.businessType)} · ${esc(l.area)} ${l.nextFollowUpDate?('· Next: '+fmtDate(l.nextFollowUpDate)):''}</div>
    </div>
    <span class="badge ${STATUS_BADGE[l.status]||'b-gray'}">${l.status}</span>
  </div>`;
}
function filterAndGo(f){ state.leadFilters = f; state.leadPage=1; goPage('leads'); }
function paymentRow(p){
  const dot = isPaymentOverdue(p) ? 'var(--red)' : isPaymentDueToday(p) ? 'var(--amber)' : 'var(--ink-faint)';
  return `<div class="work-item">
    <span class="work-dot" style="background:${dot}"></span>
    <div class="work-main">
      <div class="work-name" style="cursor:pointer" onclick="openLeadDetail('${p.leadId}')">${esc(p.leadName)}</div>
      <div class="work-sub">${DB.settings.currency}${Number(p.amount).toLocaleString('en-IN')} due ${fmtDate(p.dueDate)} ${p.note?('· '+esc(p.note)):''}</div>
    </div>
    <button class="btn btn-sm" onclick="markPaymentPaid('${p.leadId}','${p.id}')">Mark Paid</button>
  </div>`;
}
function noticeRow(n){
  const dot = isNoticeOverdue(n) ? 'var(--red)' : isNoticeDueToday(n) ? 'var(--amber)' : 'var(--ink-faint)';
  return `<div class="work-item">
    <span class="work-dot" style="background:${dot}"></span>
    <div class="work-main">
      <div class="work-name" style="cursor:pointer" onclick="openNoticeModal('${n.id}')">${esc(n.title)}</div>
      <div class="work-sub">${esc(n.note)} · Reminder: ${fmtDate(n.reminderDate)}</div>
    </div>
    <button class="btn btn-sm" onclick="markNoticeDone('${n.id}')">Done</button>
  </div>`;
}

/* ============================================================
   LEADS
   ============================================================ */
function getFilteredLeads(){
  let leads = activeLeads();
  const f = state.leadFilters, s = state.search.trim().toLowerCase();
  if(s){
    leads = leads.filter(l => [l.businessName,l.contactPerson,l.phone,l.area,l.status,l.businessType,...(l.products||[])]
      .join(' ').toLowerCase().includes(s));
  }
  if(f.area) leads = leads.filter(l=>l.area===f.area);
  if(f.district) leads = leads.filter(l=>districtOfArea(l.area)===f.district);
  if(f.category) leads = leads.filter(l=>categoryOf(l.businessType)===f.category);
  if(f.type) leads = leads.filter(l=>l.businessType===f.type);
  if(f.status) leads = leads.filter(l=>l.status===f.status);
  if(f.priority) leads = leads.filter(l=>l.priority===f.priority);
  if(f.product) leads = leads.filter(l=>(l.products||[]).includes(f.product));
  if(f.contact==='contacted') leads = leads.filter(l=>l.status!=='Yet to Contact');
  if(f.contact==='pending') leads = leads.filter(l=>l.status==='Yet to Contact');
  if(f.fu==='due') leads = leads.filter(isDueToday);
  if(f.fu==='overdue') leads = leads.filter(isOverdue);
  const key = state.leadSort.key, dir = state.leadSort.dir;
  leads = leads.slice().sort((a,b)=>{
    const av=(a[key]||''), bv=(b[key]||'');
    return av<bv?-1*dir:av>bv?1*dir:0;
  });
  return leads;
}
function renderLeads(){
  const all = getFilteredLeads();
  const totalPages = Math.max(1, Math.ceil(all.length/state.pageSize));
  state.leadPage = Math.min(state.leadPage, totalPages);
  const pageItems = all.slice((state.leadPage-1)*state.pageSize, state.leadPage*state.pageSize);
  const f = state.leadFilters;
  const opt = (arr,val)=>arr.map(a=>`<option value="${esc(a)}" ${val===a?'selected':''}>${esc(a)}</option>`).join('');

  return `
    <div class="page-head">
      <div><h1 class="page-title">Leads</h1><div class="page-desc">${all.length} of ${activeLeads().length} leads shown</div></div>
    </div>
    <div class="filter-bar">
      <select onchange="setFilter('district',this.value)"><option value="">All Districts</option>${opt(DB.settings.districts,f.district)}</select>
      <select onchange="setFilter('area',this.value)"><option value="">All Areas</option>${opt(DB.settings.areas,f.area)}</select>
      <select onchange="setFilter('category',this.value)"><option value="">All Categories</option>${opt(['Plywood & Timber','Interior & Modular','Other Trade'],f.category)}</select>
      <select onchange="setFilter('type',this.value)"><option value="">All Types</option>${opt(DB.settings.businessTypes,f.type)}</select>
      <select onchange="setFilter('status',this.value)"><option value="">All Statuses</option>${opt(STATUS_LIST,f.status)}</select>
      <select onchange="setFilter('priority',this.value)"><option value="">All Priority</option>${opt(['High','Medium','Low'],f.priority)}</select>
      <select onchange="setFilter('product',this.value)"><option value="">All Products</option>${opt(DB.settings.products,f.product)}</select>
      <select onchange="setFilter('contact',this.value)">
        <option value="">Contacted / Not</option>
        <option value="contacted" ${f.contact==='contacted'?'selected':''}>Contacted</option>
        <option value="pending" ${f.contact==='pending'?'selected':''}>Yet to Contact</option>
      </select>
      <select onchange="setFilter('fu',this.value)">
        <option value="">Follow-Up</option>
        <option value="due" ${f.fu==='due'?'selected':''}>Due Today</option>
        <option value="overdue" ${f.fu==='overdue'?'selected':''}>Overdue</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="clearFilters()">Clear Filters</button>
      <div class="view-toggle">
        <button class="${state.leadView==='table'?'active':''}" onclick="setLeadView('table')">${icon('grid')}</button>
        <button class="${state.leadView==='card'?'active':''}" onclick="setLeadView('card')">${icon('users')}</button>
      </div>
    </div>
    ${state.leadView==='table' ? renderLeadTable(pageItems) : renderLeadCards(pageItems)}
    <div class="pagination">
      <span>Page ${state.leadPage} of ${totalPages}</span>
      <div style="display:flex;gap:6px;">
        <button onclick="changeLeadPage(-1)" ${state.leadPage<=1?'disabled':''}>Prev</button>
        <button onclick="changeLeadPage(1)" ${state.leadPage>=totalPages?'disabled':''}>Next</button>
      </div>
    </div>
  `;
}

      <td>${esc(l.phone)}</td>
      <td>${esc(l.area)}</td>
      <td><span class="badge ${STATUS_BADGE[l.status]||'b-gray'}">${l.status}</span></td>

      <td>${fmtDate(l.lastContactDate)}</td>

      <td><div class="row-actions">

function saveLead(id){
  const val = k=>document.getElementById(k).value.trim();
  const businessName = val('f_businessName');
  if(!businessName){ toast('Business name is required.'); return; }
  const products = [...document.querySelectorAll('#f_products .chip.on')].map(c=>c.dataset.p);
  const note = val('f_notes');
  const now = new Date().toISOString();
  if(id){
    const l = DB.leads.find(x=>x.id===id);
    const oldStatus = l.status;
    Object.assign(l, {
      businessName, businessType:val('f_businessType'), contactPerson:val('f_contactPerson'), phone:val('f_phone'),
      whatsapp:val('f_whatsapp'), altPhone:val('f_altPhone'), email:val('f_email'), area:val('f_area'), address:val('f_address'), city:val('f_city'),
      pincode:val('f_pincode'), mapsLink:val('f_mapsLink'), website:val('f_website'), instagram:val('f_instagram'), facebook:val('f_facebook'),
      source:val('f_source'), priority:val('f_priority'),
      status:val('f_status'), lastContactDate:val('f_lastContactDate'), nextFollowUpDate:val('f_nextFollowUpDate'),
      products, updatedAt:now
    });
    if(oldStatus!==l.status){ l.history=l.history||[]; l.history.push({date:todayISO(),type:'Status Change',status:l.status,note:`Status changed: ${oldStatus} → ${l.status}`}); logActivity(`${businessName}: status changed ${oldStatus} → ${l.status}`); }
    if(note){ l.notes=l.notes||[]; l.notes.push({date:now, text:note}); }
    toast('Lead updated.');
  } else {
    const nl = {
      id:uid(), businessName, businessType:val('f_businessType'), contactPerson:val('f_contactPerson'), phone:val('f_phone'),
      whatsapp:val('f_whatsapp'), altPhone:val('f_altPhone'), email:val('f_email'), area:val('f_area'), address:val('f_address'), city:val('f_city'),
      pincode:val('f_pincode'), mapsLink:val('f_mapsLink'), website:val('f_website'), instagram:val('f_instagram'), facebook:val('f_facebook'), products,
      source:val('f_source')||'Field Visit', priority:val('f_priority'), status:val('f_status'), tags:[],
      lastContactDate:val('f_lastContactDate'), nextFollowUpDate:val('f_nextFollowUpDate'), followUpReason:'',
      notes: note?[{date:now,text:note}]:[], history:[{date:todayISO(),type:'Created',status:val('f_status'),note:'Lead added.'}],
      createdAt:now, updatedAt:now, deleted:false
    };
    DB.leads.push(nl);
    logActivity(`Added new lead: ${businessName} (${nl.area})`);
    toast('Lead successfully added.');
  }
  saveDB(); closeOverlay(); renderNav(); render();
}

function setFollowup(id, days, custom){
  const l = DB.leads.find(x=>x.id===id);
  const reasonEl = document.getElementById('fuReason');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  let date;
  if(custom){ const c=document.getElementById('customFuDate').value; if(!c){ toast('Pick a date first.'); return; } date=c; }
  else date = addDays(todayISO(), days);
  l.nextFollowUpDate = date; l.followUpReason = reason || l.followUpReason;
  if(l.status==='Yet to Contact') l.status='Contacted';
  l.updatedAt = new Date().toISOString();
  saveDB(); closeOverlay(); toast(`Next follow-up set for ${fmtDate(date)}.`);
  renderNav(); render();
}

  showOverlay(`

      </div>
      <div class="modal-foot">

function selectResultChip(el){ document.querySelectorAll('#resultChips .chip').forEach(c=>c.classList.remove('on')); el.classList.add('on'); }
const RESULT_STATUS_MAP = {
  'Interested':'Interested','Need More Information':'Follow-Up Required','Send Catalogue':'Follow-Up Required',
  'Send Price List':'Follow-Up Required','Send Samples':'Sample Given','Meeting Required':'Meeting Scheduled',
  'Quotation Required':'Quotation Given','Order Expected':'Order Expected','Call Again':'Follow-Up Required','Not Interested':'Not Interested'
};
function completeFollowup(id){
  const chip = document.querySelector('#resultChips .chip.on');
  const result = chip ? chip.dataset.r : 'Follow-Up Required';
  const note = document.getElementById('fuCompleteNote').value.trim();
  const l = DB.leads.find(x=>x.id===id);
  l.status = RESULT_STATUS_MAP[result] || l.status;
  l.history = l.history||[]; l.history.push({date:todayISO(), type:'Follow-Up', status:l.status, note: note || `Result: ${result}`});
  l.lastContactDate = todayISO();
  l.nextFollowUpDate = '';
  l.updatedAt = new Date().toISOString();
  saveDB(); logActivity(`${l.businessName}: follow-up completed — ${result}`);
  closeOverlay();
  if(!['Not Interested','Order Expected'].includes(result) || result==='Order Expected'){
    if(result!=='Not Interested'){ toast('Follow-up completed.'); openFollowupPicker(id); return; }
  }
  toast('Follow-up completed.'); renderNav(); render();
}

function renderFollowups(){
  const leads = activeLeads().filter(l=>l.nextFollowUpDate && !['Converted','Not Interested','Lost'].includes(l.status));
  const overdue = leads.filter(isOverdue).sort((a,b)=>a.nextFollowUpDate.localeCompare(b.nextFollowUpDate));
  const today = leads.filter(isDueToday);
  const upcoming = leads.filter(isUpcoming).sort((a,b)=>a.nextFollowUpDate.localeCompare(b.nextFollowUpDate));
  const grouped = {};
  upcoming.forEach(l=>{ (grouped[l.nextFollowUpDate]=grouped[l.nextFollowUpDate]||[]).push(l); });

  const rowHtml = l => `
    <div class="work-item">
      <span class="work-dot" style="background:${isOverdue(l)?'var(--red)':isDueToday(l)?'var(--amber)':'var(--blue)'}"></span>
      <div class="work-main">
        <div class="work-name" style="cursor:pointer" onclick="openLeadDetail('${l.id}')">${esc(l.businessName)}</div>
        <div class="work-sub">${esc(l.businessType)} · ${esc(l.area)} · ${esc(l.phone)} ${l.followUpReason?('· '+esc(l.followUpReason)):''}</div>
      </div>
      <span class="badge ${STATUS_BADGE[l.status]||'b-gray'}">${l.status}</span>
      <div class="row-actions" style="margin-left:8px">
        <button class="icon-btn" title="Complete" onclick="openCompleteFollowup('${l.id}')">${icon('check')}</button>
        <button class="icon-btn" title="Reschedule" onclick="openFollowupPicker('${l.id}')">${icon('clock')}</button>
      </div>
    </div>`;

  return `
    <div class="page-head"><div><h1 class="page-title">Follow-Ups</h1><div class="page-desc">${overdue.length} overdue · ${today.length} due today · ${upcoming.length} upcoming</div></div></div>
    <div class="panel"><div class="panel-head"><div class="panel-title" style="color:var(--red)">Overdue <span class="count">${overdue.length}</span></div></div>
      ${overdue.length?overdue.map(rowHtml).join(''):'<div class="empty-row">No overdue follow-ups.</div>'}</div>
    <div class="panel"><div class="panel-head"><div class="panel-title">Due Today <span class="count">${today.length}</span></div></div>
      ${today.length?today.map(rowHtml).join(''):'<div class="empty-row">Nothing due today.</div>'}</div>
    <div class="panel"><div class="panel-head"><div class="panel-title">Upcoming <span class="count">${upcoming.length}</span></div></div>
      ${Object.keys(grouped).sort().length ? Object.keys(grouped).sort().map(d=>`
        <div class="day-group"><div class="day-label">${fmtDate(d)}</div>${grouped[d].map(rowHtml).join('')}</div>
      `).join('') : '<div class="empty-row">No upcoming follow-ups scheduled.</div>'}
    </div>
  `;
}

function savePayment(leadId, paymentId){
  const chosenLeadId = leadId || document.getElementById('p_lead').value;
  if(!chosenLeadId){ toast('Pick a client first.'); return; }
  const l = DB.leads.find(x=>x.id===chosenLeadId);
  const amount = document.getElementById('p_amount').value;
  const dueDate = document.getElementById('p_dueDate').value;
  const status = document.getElementById('p_status').value;
  const note = document.getElementById('p_note').value.trim();
  l.payments = l.payments||[];
  if(paymentId){
    const p = l.payments.find(x=>x.id===paymentId);
    Object.assign(p, {amount,dueDate,status,note});
  } else {
    l.payments.push({id:uid('P'), amount, dueDate, status, note, createdAt:new Date().toISOString()});
    logActivity(`Payment due added for ${l.businessName}: ${DB.settings.currency}${amount} by ${fmtDate(dueDate)}`);
  }
  l.updatedAt = new Date().toISOString();
  saveDB(); closeOverlay(); toast('Payment saved.'); renderNav(); render();
}
function markPaymentPaid(leadId, paymentId){
  const l = DB.leads.find(x=>x.id===leadId);
  const p = (l.payments||[]).find(x=>x.id===paymentId);
  p.status = 'Paid'; l.updatedAt = new Date().toISOString();
  l.history = l.history||[]; l.history.push({date:todayISO(), type:'Payment', status:l.status, note:`Payment of ${DB.settings.currency}${p.amount} marked as paid.`});
  logActivity(`${l.businessName}: payment of ${DB.settings.currency}${p.amount} marked paid`);
  saveDB(); toast('Payment marked as paid.'); renderNav(); render();
}
function deletePayment(leadId, paymentId){
  const l = DB.leads.find(x=>x.id===leadId);
  l.payments = (l.payments||[]).filter(x=>x.id!==paymentId);
  saveDB(); closeOverlay(); toast('Payment removed.'); renderNav(); render();
}

function saveOrder(leadId, orderId){
  const chosenLeadId = leadId || document.getElementById('o_lead').value;

  const note = document.getElementById('o_note').value.trim();
  l.orders = l.orders||[];
  if(orderId){

    Object.assign(o, {orderValue,status,orderDate,expectedClosing,products,note});

function setOrderStatus(leadId, orderId, status){

  l.updatedAt = new Date().toISOString();
  saveDB(); toast('Order updated.'); renderNav(); render();
}
function deleteOrder(leadId, orderId){

  saveDB(); closeOverlay(); toast('Order removed.'); renderNav(); render();
}

/* ============================================================
   AREAS
   ============================================================ */
function areaStat(a, leads){
  const al = leads.filter(l=>l.area===a);
  const total = al.length, contacted = al.filter(l=>l.status!=='Yet to Contact').length;
  const interested = al.filter(l=>l.status==='Interested').length;
  const converted = al.filter(l=>l.status==='Converted').length;
  const coverage = total ? Math.round(contacted/total*100) : 0;
  return {a,total,contacted,pending:total-contacted,interested,converted,coverage};
}
function renderAreas(){
  const leads = activeLeads();
  const districts = DB.settings.districts.slice();
  if(DB.settings.areas.some(a=>districtOfArea(a)==='Unassigned')) districts.push('Unassigned');
  return `
    <div class="page-head"><div><h1 class="page-title">Areas</h1><div class="page-desc">Marketing coverage grouped by district, across ${DB.settings.areas.length} areas</div></div>
      <button class="btn btn-sm" onclick="openAddAreaModal()">${icon('grid')} Manage Areas &amp; Districts</button>
    </div>
    ${districts.map(d=>{
      const areasInDistrict = DB.settings.areas.filter(a=>districtOfArea(a)===d);
      if(!areasInDistrict.length) return '';
      const rows = areasInDistrict.map(a=>areaStat(a,leads)).sort((x,y)=>y.total-x.total);
      const dTotal = rows.reduce((s,r)=>s+r.total,0), dContacted = rows.reduce((s,r)=>s+r.contacted,0), dConverted = rows.reduce((s,r)=>s+r.converted,0);
      return `
      <div class="panel">
        <div class="panel-head"><div class="panel-title">${esc(d)} <span class="count">${dTotal} leads · ${dContacted} contacted · ${dConverted} converted</span></div>
          <button class="btn btn-ghost btn-sm" onclick="filterAndGo({district:'${esc(d)}'})">View leads</button></div>
        <div class="area-grid">
          ${rows.map(r=>`
            <div class="area-card" onclick="filterAndGo({area:'${esc(r.a)}'})">
              <div class="area-name">${esc(r.a)}</div>
              <div class="area-city">${esc(d)}</div>
              <div class="area-stats">
                <div><b>${r.total}</b>Total</div>
                <div><b>${r.contacted}</b>Contacted</div>
                <div><b>${r.pending}</b>Pending</div>
                <div><b>${r.converted}</b>Converted</div>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${r.coverage}%"></div></div>
              <div class="bar-label"><span>Coverage</span><span>${r.coverage}%</span></div>
            </div>
          `).join('')}
        </div>
      </div>`;
    }).join('')}
  `;
}
function openAddAreaModal(){
  const distOpt = (val)=>DB.settings.districts.map(d=>`<option value="${esc(d)}" ${districtOfArea(val)===d?'selected':''}>${esc(d)}</option>`).join('');
  showOverlay(`

function removeDistrict(d){

function saveVisit(visitId){
  const val = k=>document.getElementById(k).value;
  const fields = { date:val('v_date'), business:val('v_business'), area:val('v_area'), person:val('v_person'),
    purpose:val('v_purpose'), result:val('v_result'), nextVisit:val('v_nextVisit'), notes:val('v_notes') };
  if(visitId){
    const v = DB.visits.find(x=>x.id===visitId);
    Object.assign(v, fields);
    logActivity(`Visit updated: ${fields.business} (${fields.area})`);
  } else {
    DB.visits.push(Object.assign({id:uid('V')}, fields));
    logActivity(`Visit logged: ${fields.business} (${fields.area})`);
  }
  saveDB(); closeOverlay(); toast('Visit saved.'); render();
}
function deleteVisit(id){
  showConfirm('Delete this visit?','This cannot be undone.', ()=>{
    DB.visits = DB.visits.filter(x=>x.id!==id);
    saveDB(); closeOverlay(); toast('Visit deleted.'); render();
  });
}

function drawCharts(){

  window.__charts = {};
  const ctxColor = getComputedStyle(document.body).getPropertyValue('--ink');
  const palette = ['#9C5B34','#54725A','#B9781F','#3E6E93','#6C5B8A','#AE3B32','#8B8375','#7A4527','#233024'];

  const typeCounts = {}; leads.forEach(l=>typeCounts[l.businessType]=(typeCounts[l.businessType]||0)+1);

    data:{labels:Object.keys(typeCounts), datasets:[{data:Object.values(typeCounts), backgroundColor:palette}]},

function renderImportExport(){
  return `

          <button class="btn" onclick="exportAreaReport()">Export Area Report (Excel)</button>

        <button class="btn" onclick="backupJSON()">Backup Data (JSON)</button>
        <label class="btn" style="cursor:pointer">Restore Backup<input type="file" accept=".json" style="display:none" onchange="restoreBackup(event)"></label>
      </div>
    </div>
  `;
}
let __importRows = null;
function handleImportFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const wb = XLSX.read(ev.target.result, {type: file.name.endsWith('.csv')?'string':'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    __importRows = rows;
    document.getElementById('importPreview').innerHTML = `
      <p style="font-size:13px;font-weight:700">${rows.length} records found.</p>
      <div class="table-wrap" style="max-height:260px;overflow:auto"><table><thead><tr>${Object.keys(rows[0]||{}).map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead>
      <tbody>${rows.slice(0,8).map(r=>`<tr>${Object.values(r).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-primary" onclick="confirmImport()">Import ${rows.length} Records</button><button class="btn" onclick="document.getElementById('importPreview').innerHTML=''">Cancel</button></div>
    `;
  };
  if(file.name.endsWith('.csv')) reader.readAsText(file); else reader.readAsArrayBuffer(file);
}
function pick(row, keys){ for(const k of keys){ const found = Object.keys(row).find(rk=>rk.toLowerCase().replace(/[^a-z]/g,'')===k); if(found && row[found]!=='') return row[found]; } return ''; }
function confirmImport(){
  if(!__importRows) return;
  let added=0, skipped=0;
  const existingPhones = new Set(activeLeads().map(l=>l.phone).filter(Boolean));
  __importRows.forEach(row=>{
    const phone = String(pick(row,['phone','phonenumber','mobile'])).trim();
    if(phone && existingPhones.has(phone)){ skipped++; return; }
    const name = pick(row,['businessname','business','name']);
    if(!name) { skipped++; return; }
    DB.leads.push({
      id:uid(), businessName:name, businessType: pick(row,['type','businesstype'])||'Other',
      contactPerson: pick(row,['contactperson','contact']), phone, whatsapp:'', altPhone:'', email:pick(row,['email']),
      area: pick(row,['area']) || 'Other', city: pick(row,['city'])||'Hyderabad', address: pick(row,['address']), pincode: pick(row,['pincode']),
      mapsLink:'', website:'', instagram:'', facebook:'', products:[], source:'Import', priority:'Medium',
      status: pick(row,['status'])||'Yet to Contact', tags:[],
      lastContactDate: pick(row,['lastcontact','lastcontactdate']), nextFollowUpDate: pick(row,['nextfollowup','nextfollowupdate']),
      followUpReason:'', notes: pick(row,['notes'])?[{date:new Date().toISOString(),text:pick(row,['notes'])}]:[],
      history:[{date:todayISO(),type:'Created',status:pick(row,['status'])||'Yet to Contact',note:'Imported from spreadsheet.'}],
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), deleted:false
    });
    if(phone) existingPhones.add(phone);
    added++;
  });
  logActivity(`Imported ${added} leads (${skipped} skipped as duplicate/incomplete).`);
  saveDB(); __importRows=null;
  toast(`Imported ${added} leads. ${skipped} skipped.`);
  renderNav(); goPage('leads');
}
function downloadWorkbook(rows, filename, sheetName){
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName||'Sheet1');
  XLSX.writeFile(wb, filename);
}
function leadToRow(l){
  return { 'Business Name':l.businessName,'Type':l.businessType,'Contact Person':l.contactPerson,'Phone':l.phone,
    'WhatsApp':l.whatsapp,'Email':l.email,'Area':l.area,'City':l.city,'Address':l.address,'Pincode':l.pincode,
    'Status':l.status,'Priority':l.priority,'Products':(l.products||[]).join(', '),'Last Contact':l.lastContactDate,
    'Next Follow-Up':l.nextFollowUpDate,'Tags':(l.tags||[]).join(', ') };
}
function exportLeads(which){
  const rows = (which==='filtered' ? getFilteredLeads() : activeLeads()).map(leadToRow);
  downloadWorkbook(rows, which==='filtered'?'plymaster_filtered_leads.xlsx':'plymaster_all_leads.xlsx','Leads');
  toast('Export ready — check your downloads.');
}
function exportFollowups(){
  const rows = activeLeads().filter(l=>l.nextFollowUpDate).map(leadToRow);
  downloadWorkbook(rows,'plymaster_followups.xlsx','Follow-Ups'); toast('Export ready.');
}
function exportAreaReport(){
  const leads = activeLeads();
  const rows = DB.settings.areas.map(a=>{
    const al=leads.filter(l=>l.area===a); const c=al.filter(l=>l.status!=='Yet to Contact').length;
    return {Area:a, Total:al.length, Contacted:c, Pending:al.length-c, Interested:al.filter(l=>l.status==='Interested').length, Converted:al.filter(l=>l.status==='Converted').length, 'Coverage %': al.length?Math.round(c/al.length*100):0};
  });
  downloadWorkbook(rows,'plymaster_area_report.xlsx','Area Report'); toast('Export ready.');

function exportConverted(){
  const rows = activeLeads().filter(l=>l.status==='Converted').map(leadToRow);
  downloadWorkbook(rows,'plymaster_converted_leads.xlsx','Converted'); toast('Export ready.');
}
function backupJSON(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`plymaster_backup_${todayISO()}.json`; a.click();
  toast('Backup downloaded.');
}
function restoreBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.leads) throw new Error('bad file');
      showConfirm('Restore this backup?','This will replace all shared cloud data for every authorised user.', ()=>{
        DB = data; migrateDB(); saveDB(); closeOverlay(); toast('Backup restored to the cloud.'); renderNav(); render();
      });
    }catch(err){ toast('Could not read backup file.'); }
  };
  reader.readAsText(file);
}
